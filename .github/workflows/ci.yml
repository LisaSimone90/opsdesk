name: Continuous Integration & Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Run Test Suite with Pytest
        run: |
          pytest -v

  build-and-push:
    name: Build, Push & Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: "projects/201659515240/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "gh-actions-deployer@alpine-bond-501500-f8.iam.gserviceaccount.com"

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="us-central1-docker.pkg.dev/alpine-bond-501500-f8/opsdesk-repo/opsdesk-api:${{ github.sha }}"
          docker build -t "$IMAGE_URI" -t "us-central1-docker.pkg.dev/alpine-bond-501500-f8/opsdesk-repo/opsdesk-api:latest" .
          docker push "$IMAGE_URI"
          docker push "us-central1-docker.pkg.dev/alpine-bond-501500-f8/opsdesk-repo/opsdesk-api:latest"

      - name: Deploy Revision to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: opsdesk-api
          region: us-central1
          image: us-central1-docker.pkg.dev/alpine-bond-501500-f8/opsdesk-repo/opsdesk-api:${{ github.sha }}

      - name: Display Service URL
        run: echo "Deployed service URL is ${{ steps.deploy.outputs.url }}"